<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Армия спорта — первый этап</title>
<meta name="robots" content="noindex">
<link rel="preload" href="fonts/GolosText-500-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="as.css">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<!-- скелет загрузки: виден сразу, пока грузятся стили и код; build.py берет этот кусок в блок Тильды -->
<!-- скелет -->
<div id="as-skel" class="as-skel" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:#fff;padding:0 clamp(16px,4vw,56px)">
<style>#as-skel i{display:block;border-radius:8px;background:linear-gradient(100deg,#F4F4F5 30%,#FAFAFA 50%,#F4F4F5 70%);background-size:220% 100%;animation:as-sk 1.3s linear infinite}@keyframes as-sk{from{background-position:120% 0}to{background-position:-120% 0}}#as-skel .g{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;max-width:1320px;margin:0 auto;min-height:calc(100vh - 64px)}@media(max-width:1000px){#as-skel .g{grid-template-columns:1fr;align-content:center}}</style>
<div style="max-width:1320px;margin:0 auto;height:64px;display:flex;align-items:center;gap:12px"><i style="width:160px;height:20px"></i><i style="width:240px;height:36px;margin-left:auto;border-radius:99px"></i></div>
<div class="g"><div><i style="width:40%;height:18px;margin-bottom:22px"></i><i style="width:90%;height:clamp(44px,7vw,100px);margin-bottom:12px"></i><i style="width:70%;height:clamp(44px,7vw,100px);margin-bottom:28px"></i><i style="width:80%;height:22px;margin-bottom:10px"></i><i style="width:60%;height:22px;margin-bottom:32px"></i><i style="width:150px;height:48px;border-radius:99px"></i></div><i style="aspect-ratio:1;width:100%"></i></div>
</div>
<!-- /скелет -->
<div id="as"></div>
<script>window.AS_BASE=''</script>
<script src="as.js" defer></script>
</body>
</html>
